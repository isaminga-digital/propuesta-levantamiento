<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
  :root { --fondo: #F1FAFE; --tarjeta: #FFFFFF; --texto: #3A3A3C; --suave: #66676A; --acento: #0448A3; --error: #C2410C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 1rem; background: var(--fondo); color: var(--texto);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
  form { width: min(380px, 100%); padding: 2rem 1.75rem; border-radius: 16px; background: var(--tarjeta);
    box-shadow: 0 24px 48px -24px rgba(4, 72, 163, .18); display: grid; gap: 1rem; }
  .marca { font-family: Montserrat, "Segoe UI", system-ui, sans-serif; font-weight: 800; font-size: 1.35rem; letter-spacing: .08em; }
  .marca span { color: var(--acento); }
  .marca-logo { display: block; height: 46px; width: auto; margin-bottom: .25rem; }
  h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
  p { margin: 0; color: var(--suave); font-size: .9rem; line-height: 1.5; }
  label { display: grid; gap: .4rem; font-size: .85rem; color: var(--suave); }
  input[type="password"] { width: 100%; min-height: 48px; padding: .75rem .9rem; border-radius: 10px; border: 1px solid #B8E2F8;
    background: #FFFFFF; color: var(--texto); font-size: 1rem; }
  input[type="password"]:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
  .recordar { display: flex; align-items: center; gap: .5rem; grid-template-columns: none; }
  button { min-height: 48px; border: 0; border-radius: 10px; background: var(--acento); color: #FFFFFF; font-weight: 700; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .7; cursor: progress; }
  .estado { min-height: 1.2em; font-size: .85rem; color: var(--error); }
</style>

  var CLAVE_LOCAL = "isaminga-propuesta-" + SAL.slice(0, 12);
  function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

    var abrirGuardada = function () {

    var boton = document.getElementById("boton"), estado = document.getElementById("estado");

    boton.disabled = true; boton.textContent = "Abriendo…"; estado.textContent = "";

    llaveDesdeClave(document.getElementById("clave").value).then(function (k) {

      return crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, llave, bytes(DATOS));
